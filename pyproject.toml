[project]
name = "sensmaps"
version = "1.4.0"
description = "Interactive GUI for 2D sensitivity maps in diffuse optical imaging"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Giles Blaney" }]
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# mc backend planned for v3: https://github.com/fangq/umcx (install method TBD)

[project.scripts]
sensmaps = "sensmaps.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensmaps"]
